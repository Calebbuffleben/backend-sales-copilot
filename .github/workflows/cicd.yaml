# CI/CD: GitHub Actions → Artifact Registry → Cloud Run
#
# Repo root = esta pasta (backend/).
#
# GitHub Secrets (obrigatório):
#   GCP_SA_KEY — JSON da service account
#     Roles mínimas na SA:
#       - roles/artifactregistry.writer
#       - roles/run.admin
#       - roles/iam.serviceAccountUser
#       - roles/secretmanager.secretAccessor  (se usar --set-secrets)
#
# GitHub Variables (obrigatório):
#   GCP_PROJECT_ID — ID do projeto GCP
#
# Secret Manager (recomendado; nomes usados no deploy):
#   meet-database-url, meet-jwt-private-key, meet-jwt-public-key, meet-service-bootstrap-key
# Se ainda não existirem, o job "Deploy" falha no --set-secrets — crie-os antes ou
# remova a flag --set-secrets e configure no Console.

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: backend
  # {REGION}-docker.pkg.dev/{PROJECT_ID}/{AR_REPO}/{IMAGE_NAME}
  AR_REPO: backend
  IMAGE_NAME: backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require GCP_PROJECT_ID
        run: |
          if [ -z "${{ env.PROJECT_ID }}" ]; then
            echo "Defina a Variables do repositório: GCP_PROJECT_ID" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${IMAGE}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${IMAGE}:latest" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t "${IMAGE_SHA}" \
            -t "${IMAGE_LATEST}" \
            .

      # Em PR: só valida o build. Em push main: publica no Artifact Registry.
      - name: Push to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          IMAGE_SHA="${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"

          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --image="${IMAGE_SHA}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=1 \
            --max-instances=4 \
            --timeout=3600 \
            --cpu=2 \
            --memory=1Gi \
            --cpu-boost \
            --set-env-vars="NODE_ENV=production,GRPC_TLS_TERMINATED_AT_EDGE=true,GRPC_FEEDBACK_PORT=50052" \
            --set-secrets="DATABASE_URL=meet-database-url:latest,JWT_PRIVATE_KEY=meet-jwt-private-key:latest,JWT_PUBLIC_KEY=meet-jwt-public-key:latest,SERVICE_BOOTSTRAP_KEY=meet-service-bootstrap-key:latest"

          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)'
