# CI/CD: GitHub Actions → Artifact Registry → Cloud Run
#
# Repo root = esta pasta (backend/).
#
# pull_request: só builda a imagem (não precisa GCP_PROJECT_ID / GCP_SA_KEY)
# push main: build → push Artifact Registry → deploy Cloud Run
#
# GitHub Secrets (obrigatório para deploy):
#   GCP_SA_KEY — JSON da service account
#     Roles: artifactregistry.writer, run.admin, iam.serviceAccountUser,
#            secretmanager.secretAccessor (se usar --set-secrets)
#
# GitHub Variables (obrigatório para deploy):
#   GCP_PROJECT_ID — Settings → Secrets and variables → Actions → aba Variables
#   (também aceita Secret com o mesmo nome)
#
# Secret Manager (deploy):
#   meet-database-url, meet-jwt-private-key, meet-jwt-public-key, meet-service-bootstrap-key

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  # Artifact Registry repo `backend` está em southamerica-east1 (não us-central1)
  REGION: southamerica-east1
  SERVICE_NAME: backend
  AR_REPO: backend
  IMAGE_NAME: backend

jobs:
  # ---------------------------------------------------------------------------
  # PR: valida Dockerfile sem tocar no GCP
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (PR check)
        if: github.event_name == 'pull_request'
        run: docker build -f Dockerfile -t backend:pr-${{ github.sha }} .

      - name: Require GCP_PROJECT_ID
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID está vazio no push para main."
            echo "Crie em: Settings → Secrets and variables → Actions → aba Variables"
            echo "Nome exato: GCP_PROJECT_ID"
            exit 1
          fi
          echo "Using GCP project: ${PROJECT_ID}"
          echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Image metadata
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_SHA=${IMAGE}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${IMAGE}:latest" >> "$GITHUB_ENV"

      - name: Build and Push to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -f Dockerfile -t "${IMAGE_SHA}" -t "${IMAGE_LATEST}" .
          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"

  # ---------------------------------------------------------------------------
  # main only: deploy Cloud Run
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve project id
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID vazio" >&2
            exit 1
          fi
          echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          IMAGE_SHA="${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"

          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --image="${IMAGE_SHA}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=1 \
            --max-instances=4 \
            --timeout=3600 \
            --cpu=2 \
            --memory=1Gi \
            --cpu-boost \
            --set-env-vars="NODE_ENV=production,GRPC_TLS_TERMINATED_AT_EDGE=true,GRPC_FEEDBACK_PORT=50052" \
            --set-secrets="DATABASE_URL=meet-database-url:latest,JWT_PRIVATE_KEY=meet-jwt-private-key:latest,JWT_PUBLIC_KEY=meet-jwt-public-key:latest,SERVICE_BOOTSTRAP_KEY=meet-service-bootstrap-key:latest"

          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)'
