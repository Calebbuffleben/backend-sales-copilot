# CI/CD: GitHub Actions → Artifact Registry → Cloud Run (multi-container)
#
# Serviço Cloud Run `backend` = 2 containers:
#   - envoy (ingress :8080) — HTTP/WS + gRPC mux
#   - nest  (PORT=3001, gRPC :50052) — app
#
# NÃO usar `gcloud run deploy --image … --port=8080` (força single-container).
# Deploy = render YAML + `gcloud run services replace`.
#
# SA do secret GCP_SA_KEY (obrigatório no AR):
#   github-actions@iluma-504019.iam.gserviceaccount.com
#
# Grant NO REPOSITÓRIO (não só no projeto):
#   gcloud artifacts repositories add-iam-policy-binding backend \
#     --project=iluma-504019 \
#     --location=southamerica-east1 \
#     --member="serviceAccount:github-actions@iluma-504019.iam.gserviceaccount.com" \
#     --role="roles/artifactregistry.writer"

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  REGION: southamerica-east1
  SERVICE_NAME: backend
  AR_REPO: backend
  IMAGE_NAME: backend
  ENVOY_IMAGE_NAME: envoy
  CLOUD_RUN_SA_EMAIL: 770631129946-compute@developer.gserviceaccount.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      backend_image: ${{ steps.push.outputs.backend_image }}
      envoy_image: ${{ steps.push.outputs.envoy_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images (PR check)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t backend:pr-${{ github.sha }} .
          docker build -f deploy/envoy/Dockerfile -t envoy:pr-${{ github.sha }} deploy/envoy

      - name: Require GCP_PROJECT_ID
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID vazio (Settings → Actions → Variables)"
            exit 1
          fi
          echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Artifact Registry upload permission
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Active SA: ${ACCOUNT}"
          POLICY="$(gcloud artifacts repositories get-iam-policy "${AR_REPO}" \
            --location="${REGION}" \
            --project="${PROJECT_ID}" \
            --format=json)"
          if ! echo "${POLICY}" | grep -q "${ACCOUNT}"; then
            echo "::error::SA ${ACCOUNT} não aparece no IAM do repo ${AR_REPO}."
            exit 1
          fi
          if ! echo "${POLICY}" | grep -q 'roles/artifactregistry.writer'; then
            echo "::error::Repo ${AR_REPO} sem roles/artifactregistry.writer."
            exit 1
          fi

      - name: Docker login to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud auth print-access-token \
            | docker login -u oauth2accesstoken --password-stdin "https://${REGION}-docker.pkg.dev"

      - name: Build and Push Nest + Envoy images
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}"
          NEST_SHA="${BASE}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          NEST_LATEST="${BASE}/${{ env.IMAGE_NAME }}:latest"
          ENVOY_SHA="${BASE}/${{ env.ENVOY_IMAGE_NAME }}:${{ github.sha }}"
          ENVOY_LATEST="${BASE}/${{ env.ENVOY_IMAGE_NAME }}:latest"

          echo "Pushing ${NEST_SHA}"
          docker build -f Dockerfile -t "${NEST_SHA}" -t "${NEST_LATEST}" .
          docker push "${NEST_SHA}"
          docker push "${NEST_LATEST}"

          echo "Pushing ${ENVOY_SHA}"
          docker build -f deploy/envoy/Dockerfile -t "${ENVOY_SHA}" -t "${ENVOY_LATEST}" deploy/envoy
          docker push "${ENVOY_SHA}"
          docker push "${ENVOY_LATEST}"

          echo "backend_image=${NEST_SHA}" >> "$GITHUB_OUTPUT"
          echo "envoy_image=${ENVOY_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve project id
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID vazio" >&2
            exit 1
          fi
          echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Render YAML and replace Cloud Run service
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          ENVOY_IMAGE: ${{ needs.build-and-push.outputs.envoy_image }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          SERVICE_BOOTSTRAP_KEY: ${{ secrets.SERVICE_BOOTSTRAP_KEY }}
          PLATFORM_ADMIN_API_TOKEN: ${{ secrets.PLATFORM_ADMIN_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DEEP_REDIS_URL: ${{ secrets.DEEP_REDIS_URL }}
          CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME || secrets.CLOUD_SQL_CONNECTION_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_IMAGE}" ] || [[ "${BACKEND_IMAGE}" == :* ]]; then
            BACKEND_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:${{ github.sha }}"
          fi
          if [ -z "${ENVOY_IMAGE}" ] || [[ "${ENVOY_IMAGE}" == :* ]]; then
            ENVOY_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${ENVOY_IMAGE_NAME}:${{ github.sha }}"
          fi

          echo "Nest image:  ${BACKEND_IMAGE}"
          echo "Envoy image: ${ENVOY_IMAGE}"

          if [ -z "${DATABASE_URL}" ] || [ -z "${SERVICE_BOOTSTRAP_KEY}" ]; then
            echo "::error::Cadastre DATABASE_URL e SERVICE_BOOTSTRAP_KEY."
            exit 1
          fi

          # Nest: RS256 (JWT_PRIVATE_KEY+JWT_PUBLIC_KEY) em production;
          # HS256 (JWT_SECRET) só com NODE_ENV !== production.
          if [ -n "${JWT_PRIVATE_KEY}" ] && [ -n "${JWT_PUBLIC_KEY}" ]; then
            NODE_ENV_VALUE="production"
          elif [ -n "${JWT_SECRET}" ]; then
            NODE_ENV_VALUE="development"
            echo "::warning::Sem JWT_PRIVATE_KEY/JWT_PUBLIC_KEY — NODE_ENV=development (HS256). Cadastre as keys RS256 para production."
          else
            echo "::error::Cadastre JWT_PRIVATE_KEY+JWT_PUBLIC_KEY (RS256) ou JWT_SECRET (HS256)."
            exit 1
          fi

          CLOUD_SQL_CONNECTION="${CLOUD_SQL_CONNECTION_NAME:-}"
          if [ -z "${CLOUD_SQL_CONNECTION}" ]; then
            echo "::error::CLOUD_SQL_CONNECTION_NAME vazio (ex.: iluma-504019:southamerica-east1:root)."
            exit 1
          fi

          usable_redis() {
            local url="${1:-}"
            [ -n "${url}" ] || return 1
            [[ "${url}" == *".railway.internal"* ]] && return 1
            return 0
          }
          REDIS_FOR_RUN=""
          DEEP_REDIS_FOR_RUN=""
          if usable_redis "${REDIS_URL}"; then
            REDIS_FOR_RUN="${REDIS_URL}"
          elif [ -n "${REDIS_URL}" ]; then
            echo "::warning::REDIS_URL ignorada (host privado Railway)."
          fi
          if usable_redis "${DEEP_REDIS_URL}"; then
            DEEP_REDIS_FOR_RUN="${DEEP_REDIS_URL}"
          elif [ -n "${DEEP_REDIS_URL}" ]; then
            echo "::warning::DEEP_REDIS_URL ignorada (host privado Railway)."
          fi

          # Não imprimir este arquivo: contém credenciais.
          # PEM keys: GitHub secrets often store literal \n — expand to real newlines for Nest.
          expand_pem() {
            printf '%s' "${1:-}" | sed 's/\\n/\n/g'
          }
          JWT_PRIVATE_EXPANDED="$(expand_pem "${JWT_PRIVATE_KEY}")"
          JWT_PUBLIC_EXPANDED="$(expand_pem "${JWT_PUBLIC_KEY}")"

          jq -n \
            --arg nodeEnv "${NODE_ENV_VALUE}" \
            --arg databaseUrl "${DATABASE_URL}" \
            --arg jwtSecret "${JWT_SECRET}" \
            --arg jwtPrivate "${JWT_PRIVATE_EXPANDED}" \
            --arg jwtPublic "${JWT_PUBLIC_EXPANDED}" \
            --arg bootstrapKey "${SERVICE_BOOTSTRAP_KEY}" \
            --arg platformToken "${PLATFORM_ADMIN_API_TOKEN}" \
            --arg redisUrl "${REDIS_FOR_RUN}" \
            --arg deepRedisUrl "${DEEP_REDIS_FOR_RUN}" \
            '{
              NODE_ENV: $nodeEnv,
              DATABASE_URL: $databaseUrl,
              JWT_ISSUER: "meet-backend",
              JWT_AUDIENCE: "meet-platform",
              JWT_ACCESS_TTL_SECONDS: "900",
              JWT_REFRESH_TTL_SECONDS: "2592000",
              ALLOW_SELF_SIGNUP: "true",
              SERVICE_BOOTSTRAP_KEY: $bootstrapKey,
              AUDIO_PIPELINE_GROUP_SECONDS: "0.5",
              AUDIO_PIPELINE_PAYLOAD: "wav",
              AUDIO_PIPELINE_NORMALIZE: "false",
              AUDIO_PIPELINE_COALESCE_MS: "250",
              TEXT_ANALYSIS_SERVICE_URL: "https://python-service-770631129946.southamerica-east1.run.app",
              TEXT_ANALYSIS_ENABLED: "true",
              TEXT_ANALYSIS_TIMEOUT_MS: "5000",
              AUDIO_TRANSCRIPTION_ENABLED: "true",
              GRPC_AUDIO_SERVICE_ENABLED: "false",
              GRPC_STREAM_TIMEOUT_MS: "30000",
              SALES_CLIENT_INDECISION_COOLDOWN_MS: "0",
              SALES_SOLUTION_UNDERSTOOD_ENABLED: "true",
              SALES_SOLUTION_UNDERSTOOD_DEBUG: "true",
              SALES_SOLUTION_UNDERSTOOD_THRESHOLD: "0.70",
              SALES_SOLUTION_UNDERSTOOD_COOLDOWN_MS: "120000",
              SALES_SOLUTION_UNDERSTOOD_MIN_REFORMULATION_CHARS: "40",
              SALES_SOLUTION_CONTEXT_WINDOW_MS: "90000",
              SALES_SOLUTION_CONTEXT_MAX_ENTRIES: "12",
              DEEP_QUEUE_ENABLED: (if $deepRedisUrl != "" then "true" else "false" end),
              DEEP_AUDIO_STREAM_KEY: "deep:audio_jobs",
              DEEP_RESULTS_STREAM_KEY: "deep:text_results",
              PLAYBOOKS_ENABLED: "true",
              GRPC_TLS_TERMINATED_AT_EDGE: "true",
              GRPC_FEEDBACK_PORT: "50052",
              PORT: "3001"
            }
            + (if $jwtPrivate != "" and $jwtPublic != "" then
                {JWT_PRIVATE_KEY: $jwtPrivate, JWT_PUBLIC_KEY: $jwtPublic}
              elif $jwtSecret != "" then
                {JWT_SECRET: $jwtSecret}
              else {} end)
            + (if $platformToken != "" then {PLATFORM_ADMIN_API_TOKEN: $platformToken} else {} end)
            + (if $redisUrl != "" then {REDIS_URL: $redisUrl} else {} end)
            + (if $deepRedisUrl != "" then {DEEP_REDIS_URL: $deepRedisUrl} else {} end)' \
            > nest-env.json

          python3 deploy/gcp/render-backend-service.py \
            --template deploy/gcp/backend.service.yaml \
            --env-json nest-env.json \
            --nest-image "${BACKEND_IMAGE}" \
            --envoy-image "${ENVOY_IMAGE}" \
            --cloud-sql "${CLOUD_SQL_CONNECTION}" \
            --sa-email "${CLOUD_RUN_SA_EMAIL}" \
            --region "${REGION}" \
            --out backend.service.rendered.yaml

          gcloud run services replace backend.service.rendered.yaml \
            --project="${PROJECT_ID}" \
            --region="${REGION}"

          rm -f nest-env.json backend.service.rendered.yaml

          gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)'
