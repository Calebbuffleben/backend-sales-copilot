# CI/CD: GitHub Actions → Artifact Registry → Cloud Run
#
# SA do secret GCP_SA_KEY (obrigatório no AR):
#   github-actions@iluma-504019.iam.gserviceaccount.com
#
# Grant NO REPOSITÓRIO (não só no projeto):
#   gcloud artifacts repositories add-iam-policy-binding backend \
#     --project=iluma-504019 \
#     --location=southamerica-east1 \
#     --member="serviceAccount:github-actions@iluma-504019.iam.gserviceaccount.com" \
#     --role="roles/artifactregistry.writer"
#
# Confira no Console:
#   Artifact Registry → backend → Permissions
#   Tem que listar github-actions@… com "Artifact Registry Writer"
#   Sem condição (condition) no binding.

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  REGION: southamerica-east1
  SERVICE_NAME: backend
  # Precisa ser repositório Docker Mode=Standard (NÃO Remote — Remote não aceita push)
  AR_REPO: backend
  IMAGE_NAME: backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      # URI completa com tag (não só o path base)
      image: ${{ steps.push.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (PR check)
        if: github.event_name == 'pull_request'
        run: docker build -f Dockerfile -t backend:pr-${{ github.sha }} .

      - name: Require GCP_PROJECT_ID
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID vazio (Settings → Actions → Variables)"
            exit 1
          fi
          echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Artifact Registry upload permission
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Active SA: ${ACCOUNT}"
          echo "Expected:  github-actions@${PROJECT_ID}.iam.gserviceaccount.com"

          POLICY="$(gcloud artifacts repositories get-iam-policy "${AR_REPO}" \
            --location="${REGION}" \
            --project="${PROJECT_ID}" \
            --format=json)"
          echo "Repository IAM policy:"
          echo "${POLICY}"

          if ! echo "${POLICY}" | grep -q "${ACCOUNT}"; then
            echo "::error::SA ${ACCOUNT} não aparece no IAM do repo ${AR_REPO}."
            exit 1
          fi
          if ! echo "${POLICY}" | grep -q 'roles/artifactregistry.writer'; then
            echo "::error::Repo ${AR_REPO} sem roles/artifactregistry.writer."
            exit 1
          fi
          echo "OK: ${ACCOUNT} tem Artifact Registry Writer no repo."

      - name: Docker login to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud auth print-access-token \
            | docker login -u oauth2accesstoken --password-stdin "https://${REGION}-docker.pkg.dev"

      - name: Build and Push Docker image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          IMAGE_SHA="${IMAGE}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE}:latest"
          echo "Pushing ${IMAGE_SHA}"
          docker build -f Dockerfile -t "${IMAGE_SHA}" -t "${IMAGE_LATEST}" .
          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"
          echo "image=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve project id
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID vazio" >&2
            exit 1
          fi
          echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        env:
          IMAGE_SHA: ${{ needs.build-and-push.outputs.image }}
          # Credenciais atuais do backend. Cadastre em:
          # GitHub → Settings → Secrets and variables → Actions → Secrets.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SERVICE_BOOTSTRAP_KEY: ${{ secrets.SERVICE_BOOTSTRAP_KEY }}
          PLATFORM_ADMIN_API_TOKEN: ${{ secrets.PLATFORM_ADMIN_API_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DEEP_REDIS_URL: ${{ secrets.DEEP_REDIS_URL }}
        run: |
          set -euo pipefail

          # Fallback se o output do job anterior vier vazio
          if [ -z "${IMAGE_SHA}" ] || [[ "${IMAGE_SHA}" == :* ]]; then
            IMAGE_SHA="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          fi

          echo "Deploying image: ${IMAGE_SHA}"

          # O backend conecta ao Postgres e inicializa o JWT durante o boot.
          if [ -z "${DATABASE_URL}" ] || [ -z "${JWT_SECRET}" ] || [ -z "${SERVICE_BOOTSTRAP_KEY}" ]; then
            echo "::error::Cadastre os GitHub Secrets DATABASE_URL, JWT_SECRET e SERVICE_BOOTSTRAP_KEY."
            exit 1
          fi

          # JSON é aceito por --env-vars-file e preserva URLs/senhas sem problemas
          # de escaping. Não imprimir este arquivo: ele contém credenciais.
          jq -n \
            --arg databaseUrl "${DATABASE_URL}" \
            --arg jwtSecret "${JWT_SECRET}" \
            --arg bootstrapKey "${SERVICE_BOOTSTRAP_KEY}" \
            --arg platformToken "${PLATFORM_ADMIN_API_TOKEN}" \
            --arg redisUrl "${REDIS_URL}" \
            --arg deepRedisUrl "${DEEP_REDIS_URL}" \
            '{
              NODE_ENV: "development",
              DATABASE_URL: $databaseUrl,
              JWT_SECRET: $jwtSecret,
              JWT_ISSUER: "meet-backend",
              JWT_AUDIENCE: "meet-platform",
              JWT_ACCESS_TTL_SECONDS: "900",
              JWT_REFRESH_TTL_SECONDS: "2592000",
              ALLOW_SELF_SIGNUP: "true",
              SERVICE_BOOTSTRAP_KEY: $bootstrapKey,
              AUDIO_PIPELINE_GROUP_SECONDS: "0.5",
              AUDIO_PIPELINE_PAYLOAD: "wav",
              AUDIO_PIPELINE_NORMALIZE: "false",
              AUDIO_PIPELINE_COALESCE_MS: "250",
              TEXT_ANALYSIS_SERVICE_URL: "https://text-analysis-production.up.railway.app",
              TEXT_ANALYSIS_ENABLED: "true",
              TEXT_ANALYSIS_TIMEOUT_MS: "5000",
              AUDIO_TRANSCRIPTION_ENABLED: "true",
              GRPC_AUDIO_SERVICE_ENABLED: "false",
              GRPC_STREAM_TIMEOUT_MS: "30000",
              SALES_CLIENT_INDECISION_COOLDOWN_MS: "0",
              SALES_SOLUTION_UNDERSTOOD_ENABLED: "true",
              SALES_SOLUTION_UNDERSTOOD_DEBUG: "true",
              SALES_SOLUTION_UNDERSTOOD_THRESHOLD: "0.70",
              SALES_SOLUTION_UNDERSTOOD_COOLDOWN_MS: "120000",
              SALES_SOLUTION_UNDERSTOOD_MIN_REFORMULATION_CHARS: "40",
              SALES_SOLUTION_CONTEXT_WINDOW_MS: "90000",
              SALES_SOLUTION_CONTEXT_MAX_ENTRIES: "12",
              DEEP_QUEUE_ENABLED: (if $deepRedisUrl != "" then "true" else "false" end),
              DEEP_AUDIO_STREAM_KEY: "deep:audio_jobs",
              DEEP_RESULTS_STREAM_KEY: "deep:text_results",
              PLAYBOOKS_ENABLED: "true",
              GRPC_TLS_TERMINATED_AT_EDGE: "true",
              GRPC_FEEDBACK_PORT: "50052"
            }
            + (if $platformToken != "" then {PLATFORM_ADMIN_API_TOKEN: $platformToken} else {} end)
            + (if $redisUrl != "" then {REDIS_URL: $redisUrl} else {} end)
            + (if $deepRedisUrl != "" then {DEEP_REDIS_URL: $deepRedisUrl} else {} end)' \
            > cloud-run-env.json

          # Limpa bindings antigos do Secret Manager (JWT_PRIVATE_KEY / JWT_PUBLIC_KEY).
          # Sem isso, o gcloud reusa os secrets da revisão anterior e o deploy falha.
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --image="${IMAGE_SHA}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=1 \
            --max-instances=1 \
            --timeout=3600 \
            --cpu=2 \
            --memory=1Gi \
            --cpu-boost \
            --clear-secrets \
            --env-vars-file=cloud-run-env.json

          rm -f cloud-run-env.json

          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)'
