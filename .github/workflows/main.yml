# CI/CD: GitHub Actions → docker build/push → Artifact Registry → Cloud Run
#
# Repo root = esta pasta (backend/).
#
# pull_request: só `docker build` (sem GCP)
# push main: docker build → push AR → deploy Cloud Run
#
# Secret obrigatório:
#   GCP_SA_KEY — JSON da SA github-actions@PROJECT_ID.iam.gserviceaccount.com
#
# Variable obrigatória:
#   GCP_PROJECT_ID — aba Variables (não Environments)
#
# IAM obrigatório na SA github-actions@… (projeto iluma-504019):
#   1) Artifact Registry Writer  — no PROJETO e/ou no repositório AR `backend`
#      Console: Artifact Registry → backend → Permissions → Grant access
#      Principal: github-actions@iluma-504019.iam.gserviceaccount.com
#      Role: Artifact Registry Writer
#   2) Cloud Run Admin
#   3) Service Account User  (para a runtime SA do Cloud Run)
#   4) Secret Manager Secret Accessor (se usar --set-secrets)
#
# NÃO usamos Cloud Build (bloqueio de bucket/org policy neste projeto).

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  REGION: southamerica-east1
  SERVICE_NAME: backend
  AR_REPO: backend
  IMAGE_NAME: backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (PR check)
        if: github.event_name == 'pull_request'
        run: docker build -f Dockerfile -t backend:pr-${{ github.sha }} .

      - name: Require GCP_PROJECT_ID
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID está vazio. Settings → Actions → Variables."
            exit 1
          fi
          echo "Using GCP project: ${PROJECT_ID}"
          echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Debug identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Active SA: ${ACCOUNT}"
          echo "This exact email must have Artifact Registry Writer on repo '${AR_REPO}'."
          gcloud artifacts repositories describe "${AR_REPO}" \
            --location="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(name)'

      - name: Image metadata
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_SHA=${IMAGE}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${IMAGE}:latest" >> "$GITHUB_ENV"

      - name: Docker login to Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud auth print-access-token \
            | docker login -u oauth2accesstoken --password-stdin "${REGION}-docker.pkg.dev"

      - name: Build and Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker build -f Dockerfile -t "${IMAGE_SHA}" -t "${IMAGE_LATEST}" .
          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve project id
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::GCP_PROJECT_ID vazio" >&2
            exit 1
          fi
          echo "PROJECT_ID=${PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          IMAGE_SHA="${{ needs.build-and-push.outputs.image }}:${{ github.sha }}"

          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --image="${IMAGE_SHA}" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=1 \
            --max-instances=4 \
            --timeout=3600 \
            --cpu=2 \
            --memory=1Gi \
            --cpu-boost \
            --set-env-vars="NODE_ENV=production,GRPC_TLS_TERMINATED_AT_EDGE=true,GRPC_FEEDBACK_PORT=50052" \
            --set-secrets="DATABASE_URL=meet-database-url:latest,JWT_PRIVATE_KEY=meet-jwt-private-key:latest,JWT_PUBLIC_KEY=meet-jwt-public-key:latest,SERVICE_BOOTSTRAP_KEY=meet-service-bootstrap-key:latest"

          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)'
